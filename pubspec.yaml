name: arrow_escape
description: Arrow Escape - A casual grid puzzle game where you slide arrows out of the grid.
publish_to: 'none'
version: 1.3.3+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Game Engine
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # Ads
  google_mobile_ads: ^5.1.0
  unity_ads_plugin: ^0.4.0

  # State Management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # UI & Animations
  confetti: ^0.7.0
  flutter_animate: ^4.5.0

  # Audio


  # Utils
  collection: ^1.18.0
  intl: any
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^3.1.14+2
  in_app_update: ^5.0.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/levels.bin

  fonts:
    - family: PlaypenSansArabic
      fonts:
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlaypenSansArabic/PlaypenSansArabic-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding/app_icon_foreground.png"
