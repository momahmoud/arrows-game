# Release readiness: full CI with a strict campaign audit, then a signed
# Android App Bundle that is verified and discarded. Nothing is uploaded to
# Google Play and no release is published.
name: Release readiness

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      strict-campaign: true

  android:
    name: Android App Bundle
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          AD_SECRETS_DART_BASE64: ${{ secrets.AD_SECRETS_DART_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: scripts/release/write_secrets.sh

      - name: Resolve dependencies from pubspec.lock
        run: flutter pub get --enforce-lockfile

      - name: Release ad configuration
        run: flutter test --tags release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Download bundletool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -

      - name: Verify App Bundle
        env:
          REQUIRE_RELEASE_SIGNING: '1'
        run: |
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" \
            scripts/release/verify_bundle.sh build/app/outputs/bundle/release/app-release.aab

      - name: Remove release secrets
        if: ${{ always() }}
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties \
            android/app/google-services.json lib/core/ad_secrets.dart
